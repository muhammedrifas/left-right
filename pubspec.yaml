name: left_right
description: "Left-Right: Tune Your Brain - High-speed spatial & color Stroop reflex game."
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  rename: ^3.1.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21